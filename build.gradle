buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven { name = "sponge"; url 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.54'
        classpath 'org.spongepowered:mixingradle:0.7.38'
        classpath group: 'org.parchmentmc', name: 'librarian', version: '1.2.0.7-dev-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'org.parchmentmc.librarian.forgegradle'

version = mod_version
group = 'net.shadowmage.ancientwarfare'

base {
    archivesName = 'ancientwarfare'
}
archivesBaseName = 'ancientwarfare'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    enableIdeaPrepareRuns = true
    copyIdeResources = true
    generateRunFolders = true

    runs {
        client {
            workingDirectory project.file('run/client')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            property 'forge.logging.console.level', 'debug'

            property 'forge.enabledGameTestNamespaces', 'ancient_warda'
            // arg "-mixin.config=ancientwarfare.mixins.json"

            mods {
                ancientwarfare {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run/server')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            property 'forge.logging.console.level', 'debug'

            property 'forge.enabledGameTestNamespaces', 'ancientwarfare'
            // arg "-mixin.config=ancientwarfare.mixins.json"

            mods {
                ancientwarfare {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run/testServer')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            property 'forge.logging.console.level', 'debug'

            property 'forge.enabledGameTestNamespaces', 'ancientwarfare'
            //arg "-mixin.config=ancientwarfare.mixins.json"

            mods {
                ancientwarfare {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run/data')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            property 'forge.logging.console.level', 'debug'

            args '--mod', 'ancientwarfare', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            //arg "-mixin.config=ancientwarfare.mixins.json"

            mods {
                ancientwarfare {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Expand the version placeholders that mods.toml references.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_version         : mod_version,
            loader_version_range: '[47,)',
            forge_version_range : '[47,)',
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

repositories {
    maven { // TOP
        url "https://cursemaven.com"
    }
    maven { // JEI
        name 'DVS1 Maven FS'
        url 'https://dvs1.progwml6.com/files/maven'
    }
    maven { //mirror
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { // Architectury (ftbteams dependency)
        url = 'https://maven.architectury.dev/'
    }
    maven { // FTB Library (ftbteams dependency)
        url = 'https://maven.ftb.dev/releases'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'

    // compileOnly annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1')
    // implementation "io.github.llamalad7:mixinextras-forge:0.4.1"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("curse.maven:jei-238222:6075247")
    implementation fg.deobf("curse.maven:codechicken-lib-1-8-242818:5753868")
    implementation fg.deobf("curse.maven:electroblobs-wizardry-redux-1405790:8205805")
    implementation fg.deobf("curse.maven:ftb-teams-forge-404468:7499810")
    // Runtime-only prerequisites of FTB Teams in the dev environment.
    runtimeOnly fg.deobf("dev.architectury:architectury-forge:9.1.13")
    runtimeOnly fg.deobf("dev.ftb.mods:ftb-library-forge:2001.2.13")

    //implementation fg.deobf("curse.maven:geckolib-388172:7553267")
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "Ancient Warfare 2",
                "Specification-Vendor"    : "shadowmage45, P3pp3rF1y",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "shadowmage45, P3pp3rF1y",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

task sourceJar(type: Jar) {
    archiveClassifier.set('sources')
    from sourceSets.main.allJava
}

artifacts {
    archives sourceJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifact sourceJar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

mixin {
    //add sourceSets.main, 'ancientwarfare.refmap.json'
    //config 'ancientwarfare.mixins.json'

    debug.verbose = true
    debug.export = true
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '10000', '-Xmaxwarns', '10'])
}
